<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - Website</title>
    <link rel="stylesheet" href="../stylle.css" />
  </head>

  <body>
    <!-- ========================= -->
    <!-- Navigation -->
    <!-- ========================= -->
    <nav class="site-nav">
      <div class="nav-inner">
        <div class="logo">Logo Here.</div>

        <ul class="nav-links" role="menu" aria-label="Main navigation">
          <li><a href="home.html">Home</a></li>
          <li><a href="Catagory.html">Catagory</a></li>
          <li><a href="Contact.html">Contact Us</a></li>
          <li><a href="About us.html">About us</a></li>
        </ul>

        <div class="nav-icons">
          <a class="icon-btn" href="Wishlist.html" aria-label="Wishlist">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden
            >
              <path
                d="M12 21s-7-4.35-9-6.6A5.5 5.5 0 0 1 6 4.5 6 6 0 0 1 12 8a6 6 0 0 1 6-3.5c2.5 0 3.9 2.9 3 6.1C19 16.6 12 21 12 21z"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>

          <a class="icon-btn cart" href="cart.html" aria-label="Cart">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden
            >
              <path
                d="M6 6h15l-1.5 9h-12L4 2H2"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="10" cy="20" r="1" fill="currentColor" />
              <circle cx="18" cy="20" r="1" fill="currentColor" />
            </svg>
            <span class="cart-bubble">0</span>
          </a>

          <button class="icon-btn" aria-label="account">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden
            >
              <path
                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle
                cx="12"
                cy="7"
                r="4"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <!-- ========================= -->
    <!-- Main -->
    <!-- ========================= -->

    <main class="cart-page">
      <!-- Hero -->

      <section class="cart-hero">
        <div class="cart-copy">
          <h1>Shopping Cart</h1>

          <p>Review your selected products before continuing to checkout.</p>
        </div>
      </section>

      <!-- Cart Layout -->

      <section class="cart-layout" id="cart-layout">
        <!-- Cart Items -->

        <div class="cart-items" id="cart-items">
          <!-- Cart items are dynamically rendered from localStorage via script.js -->
        </div>
        <!-- End Cart Items -->

        <!-- ========================= -->
        <!-- Order Summary -->
        <!-- ========================= -->

        <aside class="cart-summary" id="cart-summary">
          <h2>Order Summary</h2>

          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal-value">$0.00</span>
          </div>

          <div class="summary-row">
            <span>Shipping</span>
            <span id="shipping-value">$0.00</span>
          </div>

          <div class="summary-row">
            <span>Tax (8%)</span>
            <span id="tax-value">$0.00</span>
          </div>

          <div class="summary-row total">
            <span>Total</span>
            <span id="total-value">$0.00</span>
          </div>

          <a class="checkout-btn" href="checkout.html"> Proceed to Checkout </a>

          <!-- Promo -->

          <div class="promo-section">
            <label for="promo-input"> Have a Promo Code? </label>

            <div class="promo-input-group">
              <input
                type="text"
                id="promo-input"
                placeholder="Enter Promo Code"
              />

              <button id="apply-promo">Apply</button>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->

    <footer>
      <p>&copy; 2026 Your Shop. All Rights Reserved.</p>
    </footer>

    <script src="../script.js"></script>
  </body>
</html>
