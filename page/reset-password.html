<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password - Your Shop</title>
<link rel="stylesheet" href="login.css">
<script src="../config.js"></script>
<script src="../auth.js"></script>
</head>
<body>
<main class="auth-box">
  <h1>Reset password</h1>
  <p id="status">Checking your reset link...</p>
  <form id="resetForm" hidden>
    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirmPassword">Confirm password</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
    <div id="strength"></div>
    <button id="submitButton" type="submit">Set new password</button>
  </form>
  <p id="message"></p>
  <p><a href="login.html">Back to login</a></p>
</main>
<script src="reset-password.js"></script>
</body>
</html>
