<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password</title>  <link rel="stylesheet" href="../stylle.css" />
</head><body><main style="max-width:480px;margin:60px auto"><h1>Reset Password</h1><form id="form"><input id="password" type="password" minlength="8" required placeholder="New password"><button>Reset password</button></form><p id="msg"></p></main>

    </footer>
<script>const API=window.SHOP_API_BASE || ((location.hostname === "127.0.0.1" || location.hostname === "localhost") ? `${location.protocol}//${location.hostname}:5000` : "");const token=new URLSearchParams(location.search).get("token")||"";form.onsubmit=async e=>{e.preventDefault();const r=await fetch(API+"/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password:password.value})});const d=await r.json();msg.textContent=d.message||"Done";if(d.success)setTimeout(()=>location.href="login.html",1000)}</script></body></html>
