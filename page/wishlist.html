<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist</title><link rel="stylesheet" href="home.css"></head><body><main class="products-section" style="padding:40px"><h1>Wishlist</h1><div id="wishlist"></div></main><script>const API=window.SHOP_API_BASE || ((location.hostname === "127.0.0.1" || location.hostname === "localhost") ? `${location.protocol}//${location.hostname}:5000` : "");const ids=JSON.parse(localStorage.getItem("wishlist_ids")||"[]");const root=document.getElementById("wishlist");if(!ids.length)root.textContent="Your wishlist is empty.";Promise.all(ids.map(id=>fetch(API+"/products/"+encodeURIComponent(id)).then(r=>r.ok?r.json():null))).then(xs=>{xs.filter(Boolean).forEach(x=>{const p=x.product;const card=document.createElement("article");card.className="product-card";card.innerHTML="<h3></h3><p></p><button type='button'>Remove</button>";card.querySelector("h3").textContent=p.title;card.querySelector("p").textContent="$"+Number(p.current_price||p.price||0).toFixed(2);card.querySelector("button").onclick=()=>{localStorage.setItem("wishlist_ids",JSON.stringify(ids.filter(i=>String(i)!==String(p.id))));location.reload()};root.appendChild(card)})}).catch(()=>root.textContent="Could not load wishlist.")</script></body></html>
