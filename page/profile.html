<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile</title><link rel="stylesheet" href="../stylle.css"></head><body><main style="max-width:700px;margin:60px auto;padding:24px"><h1>My Profile</h1><div id="profileMessage">Loading...</div><button id="logout" type="button">Log out</button></main>
    <footer class="user-site-footer">
      <div class="user-site-footer__inner">
        <p>&copy; 2026 Your Shop. All Rights Reserved.</p>
      </div>
    </footer>
<script>const API=window.SHOP_API_BASE || ((location.hostname === "127.0.0.1" || location.hostname === "localhost") ? `${location.protocol}//${location.hostname}:5000` : "");const t=sessionStorage.getItem("token");if(!t)location.href="login.html";fetch(API+"/me",{headers:{Authorization:"Bearer "+t}}).then(r=>r.json()).then(d=>{if(!d.success)throw 0;document.getElementById("profileMessage").innerHTML="<p><strong>Username:</strong> "+escapeHtml(d.user.username)+"</p><p><strong>Email:</strong> "+escapeHtml(d.user.email)+"</p>"}).catch(()=>location.href="login.html");function escapeHtml(v){const e=document.createElement("div");e.textContent=v||"";return e.innerHTML}document.getElementById("logout").onclick=()=>{sessionStorage.clear();location.href="login.html"}</script></body></html>
