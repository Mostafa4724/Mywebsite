<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password - Your Shop</title>
<link rel="stylesheet" href="../stylle.css">
<script src="../config.js"></script>
<script src="../auth.js"></script>
</head>
<body>
<main style="max-width:480px;margin:60px auto;padding:24px">
  <h1>Change password</h1>
  <form id="changeForm">
    <label for="currentPassword">Current password</label>
    <input id="currentPassword" type="password" autocomplete="current-password" required>
    <label for="newPassword">New password</label>
    <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirmPassword">Confirm new password</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
    <p id="strength"></p>
    <button type="submit" id="submitButton">Change password</button>
  </form>
  <p id="message"></p>
</main>
<script src="change-password.js"></script>
</body>
</html>
