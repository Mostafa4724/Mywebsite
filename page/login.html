<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Your Shop</title>
    <link rel="stylesheet" href="login.css" />
    

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      .auth-box {
        max-width: 430px;
        margin: 60px auto;
        padding: 28px;
        border-radius: 16px;
      }
      .auth-box input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 7px 0 16px;
        padding: 12px;
      }
      .auth-box button {
        padding: 12px 18px;
        cursor: pointer;
      }
      .auth-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .auth-tabs button {
        flex: 1;
      }
      #registerFields {
        display: none;
      }
      #authMessage {
        min-height: 24px;
      }
      .auth-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 22px 0;
        color: #777;
      }
      .auth-divider::before,
      .auth-divider::after {
        content: "";
        height: 1px;
        background: #ddd;
        flex: 1;
      }
      #googleSignIn {
        display: flex;
        justify-content: center;
        min-height: 44px;
      }
      .google-help {
        font-size: 12px;
        color: #777;
        text-align: center;
        margin-top: 8px;
      }
      .password-field {
        position: relative;
        display: flex;
        align-items: center;
      }
      .password-field input {
        padding-right: 40px;
      }
      .password-toggle {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        cursor: pointer;
        color: #666;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s;
      }
      .password-toggle:hover {
        color: #333;
      }
      .password-toggle:focus {
        outline: none;
        color: #0066cc;
      }
    </style>
      <link rel="stylesheet" href="../stylle.css" />
</head>
  <body>
    <main class="auth-box">
      <h1 id="authTitle">Login</h1>
      <div class="auth-tabs">
        <button type="button" id="loginTab">Login</button>
        <button type="button" id="registerTab">Create account</button>
      </div>

      <form id="authForm">
        <div id="registerFields">
          <label>Username</label>
          <input id="username" autocomplete="username" />
        </div>

        <label>Email</label>
        <input id="email" type="email" required autocomplete="email" />

        <label>Password</label>
        <div class="password-field">
          <input
            id="password"
            type="password"
            required
            minlength="8"
            title="Password must be at least 8 characters long"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle"
            id="passwordToggle"
            aria-label="Show password"
          >
            <svg
              class="eye-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg
              class="eye-off-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="display: none"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              ></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <button id="submitButton" type="submit">Login</button>
        <p id="authMessage" role="alert"></p>
      </form>

      <div class="auth-divider"><span>OR</span></div>
      <div id="googleSignIn"></div>
      <p id="googleHelp" class="google-help"></p>
    </main>
<script src="login.js"></script>
<script src="../Config.js"></script>
  </body>
</html>
