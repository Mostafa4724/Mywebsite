<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Your Shop</title>
  <link rel="stylesheet" href="Login.css">
  <style>
    .auth-box{max-width:430px;margin:60px auto;padding:28px;border-radius:16px}
    .auth-box input{display:block;width:100%;box-sizing:border-box;margin:7px 0 16px;padding:12px}
    .auth-box button{padding:12px 18px;cursor:pointer}
    .auth-tabs{display:flex;gap:8px;margin-bottom:20px}
    .auth-tabs button{flex:1}
    #registerFields{display:none}
    #authMessage{min-height:24px}
  </style>
</head>
<body>
  <main class="auth-box">
    <h1 id="authTitle">Login</h1>
    <div class="auth-tabs">
      <button type="button" id="loginTab">Login</button>
      <button type="button" id="registerTab">Create account</button>
    </div>

    <form id="authForm">
      <div id="registerFields">
        <label>Username</label>
        <input id="username" autocomplete="username">
      </div>

      <label>Email</label>
      <input id="email" type="email" required autocomplete="email">

      <label>Password</label>
      <input id="password" type="password" required autocomplete="current-password">

      <button id="submitButton" type="submit">Login</button>
      <p id="authMessage" role="alert"></p>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
