<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - Admin Panel</title>
    <link rel="stylesheet" href="../stylle.css" />
    <style>
      /* ===== Preview Overlay ===== */
      .preview-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10000;
        display: none;
        background: #0a0a0a;
      }

      .preview-overlay.active {
        display: block;
        animation: previewFadeIn 0.3s ease forwards;
      }

      .preview-overlay.closing {
        animation: previewFadeOut 0.25s ease forwards;
      }

      @keyframes previewFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes previewFadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }

      .preview-overlay iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: #ffffff;
        display: block;
      }

      /* Transparent layer that blocks ALL interaction with the iframe */
      .preview-blocker {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        cursor: default;
      }

      /* Left-side control bar */
      .preview-sidebar-controls {
        position: absolute;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 14px 10px;
        background: rgba(10, 15, 26, 0.92);
        border-radius: 0 14px 14px 0;
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .preview-close-btn {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        cursor: pointer;
        transition: all 0.25s ease;
        pointer-events: auto;
      }

      .preview-close-btn:hover {
        background: #ef4444;
        border-color: #ef4444;
        transform: scale(1.1);
        box-shadow: 0 0 16px rgba(239, 68, 68, 0.5);
      }

      .preview-close-btn:active {
        transform: scale(0.95);
      }

      .preview-mode-label {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        color: rgba(255, 255, 255, 0.45);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2.5px;
        user-select: none;
        pointer-events: none;
      }

      .preview-divider {
        width: 24px;
        height: 1px;
        background: rgba(255, 255, 255, 0.12);
        pointer-events: none;
      }

      /* Preview button inside each admin product card */
      .preview-product-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        background: transparent;
        color: #2563eb;
        font-size: 0.8rem;
        font-weight: 600;
        border: 1.5px solid #93bbfd;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
        white-space: nowrap;
      }

      .preview-product-btn:hover {
        background: #eff6ff;
        border-color: #2563eb;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.15);
      }

      .preview-product-btn:active {
        transform: scale(0.96);
      }

      .preview-product-btn svg {
        flex-shrink: 0;
      }
    </style>
  </head>
  <body class="admin-body">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo-icon">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 0 1-8 0" />
          </svg>
        </div>
        <span>Admin Panel</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link" data-section="overview"
          ><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" /></svg
          >Overview</a
        >
        <a href="orders.html" class="sidebar-link" data-section="orders"
          ><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" /></svg
          >Orders<span class="sidebar-badge" id="orderBubble" hidden></span></a
        >
        <a
          href="admin_product.html"
          class="sidebar-link active"
          data-section="products"
          ><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
            /></svg
          >Products</a
        >
        <a
          href="admin-analytics.html"
          class="sidebar-link"
          data-section="analytics"
          ><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="20" x2="18" y2="10" />
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="6" y1="20" x2="6" y2="14" /></svg
          >Analytics</a
        >
      </nav>
      <div class="sidebar-footer">
        <a href="../page/login.html" class="sidebar-logout" id="adminLogout">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" /></svg
          >Log Out
        </a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <div class="topbar-title"><h2>Products</h2></div>
        <div class="topbar-right">
          <div class="admin-user-chip">
            <div class="admin-user-avatar">A</div>
            <span>Admin</span>
          </div>
        </div>
      </header>

      <div class="admin-content">
        <div class="products-toolbar">
          <div class="orders-search">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="text"
              id="productSearch"
              placeholder="Search products..."
            />
          </div>
          <button class="admin-add-btn" id="addProductBtn">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Add Product
          </button>
        </div>

        <section class="admin-product-section" data-status-section="published">
          <div class="admin-product-section-head">
            <div>
              <h3>Published Products</h3>
              <p>Products currently visible to shoppers.</p>
            </div>
            <span class="admin-product-section-count" id="publishedProductsCount">0</span>
          </div>
          <div class="products-grid" id="publishedProductsGrid">
            <div class="admin-products-message">Loading products...</div>
          </div>
        </section>

        <section class="admin-product-section" data-status-section="draft">
          <div class="admin-product-section-head">
            <div>
              <h3>Draft Products</h3>
              <p>Products saved as drafts and hidden from shoppers.</p>
            </div>
            <span class="admin-product-section-count draft" id="draftProductsCount">0</span>
          </div>
          <div class="products-grid" id="draftProductsGrid">
            <div class="admin-products-message">No draft products.</div>
          </div>
        </section>
      </div>
    </div>

    <!-- Add Product Modal -->
    <div class="admin-modal-overlay" id="addProductModal" style="display: none">
      <div class="admin-modal">
        <div class="admin-modal-head">
          <h3>Add New Product</h3>
          <button class="modal-close" id="closeModal">&times;</button>
        </div>
        <div class="admin-modal-body">
          <div class="modal-form-grid">
            <div class="form-field">
              <label>Product Name</label
              ><input type="text" placeholder="Enter product name" />
            </div>
            <div class="form-field">
              <label>Category</label
              ><select>
                <option value="">Select category</option>
                <option>Footwear</option>
                <option>Apparel</option>
                <option>Accessories</option>
                <option>Sports</option>
              </select>
            </div>
            <div class="form-field">
              <label>Price ($)</label><input type="number" placeholder="0.00" />
            </div>
            <div class="form-field">
              <label>Stock Quantity</label
              ><input type="number" placeholder="0" />
            </div>
          </div>
          <div class="form-field">
            <label>Description</label
            ><textarea rows="3" placeholder="Product description..."></textarea>
          </div>
        </div>
        <div class="admin-modal-foot">
          <button class="btn-secondary" id="cancelModal">Cancel</button>
          <button class="btn-primary" id="saveProduct">Save Product</button>
        </div>
      </div>
    </div>

    <!-- Preview Overlay -->
    <div class="preview-overlay" id="previewOverlay">
      <iframe id="previewIframe" frameborder="0" scrolling="yes"></iframe>
      <div class="preview-sidebar-controls">
        <button class="preview-close-btn" id="previewCloseBtn" aria-label="Close preview">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div class="preview-divider"></div>
        <span class="preview-mode-label">Preview</span>
      </div>
    </div>

    <script src="order-bubble.js"></script>
    <script src="../script.js"></script>
    <script src="admin-products.js"></script>
    <script src="admin-common.js"></script>
    <script src="preview-product.js"></script>
  </body>
</html>
