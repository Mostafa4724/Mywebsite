<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Orders - Admin Panel</title>

    <link
      rel="stylesheet"
      href="../stylle.css"
    />
  </head>

  <body class="admin-body">

    <aside
      class="admin-sidebar"
      id="adminSidebar"
    >
      <div class="sidebar-brand">

        <div class="sidebar-logo-icon">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"
            />

            <line
              x1="3"
              y1="6"
              x2="21"
              y2="6"
            />

            <path
              d="M16 10a4 4 0 0 1-8 0"
            />
          </svg>
        </div>

        <span>Admin Panel</span>
      </div>

      <nav class="sidebar-nav">

        <a
          href="dashboard.html"
          class="sidebar-link"
          data-section="overview"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect
              x="3"
              y="3"
              width="7"
              height="7"
            />

            <rect
              x="14"
              y="3"
              width="7"
              height="7"
            />

            <rect
              x="14"
              y="14"
              width="7"
              height="7"
            />

            <rect
              x="3"
              y="14"
              width="7"
              height="7"
            />
          </svg>

          Overview
        </a>

        <a
          href="orders.html"
          class="sidebar-link active"
          data-section="orders"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"
            />

            <line
              x1="3"
              y1="6"
              x2="21"
              y2="6"
            />
          </svg>

          Orders<span class="sidebar-badge" id="orderBubble" hidden></span>
        </a>

        <a
          href="admin_product.html"
          class="sidebar-link"
          data-section="products"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
            />
          </svg>

          Products
        </a>

        <a
          href="admin-analytics.html"
          class="sidebar-link"
          data-section="analytics"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line
              x1="18"
              y1="20"
              x2="18"
              y2="10"
            />

            <line
              x1="12"
              y1="20"
              x2="12"
              y2="4"
            />

            <line
              x1="6"
              y1="20"
              x2="6"
              y2="14"
            />
          </svg>

          Analytics
        </a>

      </nav>

      <div class="sidebar-footer">

        <a
          href="../page/login.html"
          class="sidebar-logout"
          id="adminLogout"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
            />

            <polyline
              points="16 17 21 12 16 7"
            />

            <line
              x1="21"
              y1="12"
              x2="9"
              y2="12"
            />
          </svg>

          Log Out
        </a>

      </div>
    </aside>

    <div class="admin-main">

      <header class="admin-topbar">

        <button
          class="menu-toggle"
          id="menuToggle"
          aria-label="Toggle menu"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line
              x1="3"
              y1="6"
              x2="21"
              y2="6"
            />

            <line
              x1="3"
              y1="12"
              x2="21"
              y2="12"
            />

            <line
              x1="3"
              y1="18"
              x2="21"
              y2="18"
            />
          </svg>
        </button>

        <div class="topbar-title">
          <h2>Orders</h2>
        </div>

        <div class="topbar-right">

          <div class="admin-user-chip">

            <div class="admin-user-avatar">
              A
            </div>

            <span>Admin</span>

          </div>

        </div>

      </header>

      <div class="admin-content">

        <!-- Filters -->

        <div
          class="dash-card"
          style="margin-bottom: 20px"
        >

          <div class="orders-toolbar">

            <div class="orders-search">

              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle
                  cx="11"
                  cy="11"
                  r="8"
                />

                <line
                  x1="21"
                  y1="21"
                  x2="16.65"
                  y2="16.65"
                />
              </svg>

              <input
                type="text"
                id="orderSearch"
                placeholder="Search orders by ID or buyer..."
              />

            </div>

            <div class="orders-filters">

              <select id="statusFilter">

                <option value="all">
                  All Status
                </option>

                <option value="placed">
                  Placed
                </option>

                <option value="confirmed">
                  Confirmed
                </option>

                <option value="processing">
                  Processing
                </option>

                <option value="shipped">
                  Shipped
                </option>

                <option value="delivered">
                  Delivered
                </option>

                <option value="cancelled">
                  Cancelled
                </option>

              </select>

              <select id="dateFilter">

                <option value="all">
                  All Time
                </option>

                <option value="today">
                  Today
                </option>

                <option value="week">
                  This Week
                </option>

                <option value="month">
                  This Month
                </option>

              </select>

            </div>

          </div>

        </div>

        <!-- Orders Table -->

        <div class="dash-card">

          <div class="orders-table-wrap">

            <table class="orders-table">

              <thead>

                <tr>

                  <th>
                    Order ID
                  </th>

                  <th>
                    Buyer
                  </th>

                  <th>
                    Items
                  </th>

                  <th>
                    Date
                  </th>

                  <th>
                    Amount
                  </th>

                  <th>
                    Status
                  </th>

                  <th>
                    Actions
                  </th>

                </tr>

              </thead>

              <tbody id="ordersTableBody">
                <!-- Orders are loaded from the backend by admin/orders.js -->
              </tbody>

            </table>

          </div>

          <div class="table-pagination">

            <span class="page-info">
              Showing 1-8 of 24 orders
            </span>

          </div>

        </div>

      </div>

    </div>

    <script src="order-bubble.js"></script>
    <script src="../script.js"></script>
    <script src="orders.js"></script>

  </body>
</html>
